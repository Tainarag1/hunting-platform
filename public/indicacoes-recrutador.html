<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuntFlow - Gerenciar Indicações</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Menu Hambúrguer para Recrutadores -->
  <header class="header-recrutador">
    <button class="hamburger-btn" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <div class="logo-inline">
      <a href="#" onclick="irParaDashboard()">
        <svg class="logo-svg-small" width="32" height="32" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="12" r="6" fill="#4f46e5"/>
          <circle cx="10" cy="28" r="5" fill="#7c3aed"/>
          <circle cx="30" cy="28" r="5" fill="#7c3aed"/>
          <path d="M20 20 L10 23 M20 20 L30 23 M10 28 L30 28" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="logo-text-small">HuntFlow</span>
      </a>
    </div>
  </header>

  <!-- Sidebar Menu -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span id="sidebarUserName">Usuário</span>
      <button class="sidebar-close" onclick="toggleSidebar()">×</button>
    </div>
    <nav class="sidebar-nav">
      <a href="/" id="linkProcessos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        Processos Seletivos
      </a>
      <a href="/candidatos.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        Candidatos
      </a>
      <a href="/indicacoes-recrutador.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        Indicações
      </a>
      <a href="#" onclick="sairDaConta()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Sair da conta
      </a>
    </nav>
  </div>

  <!-- Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <div class="container" style="padding-top: 100px;">
    <!-- Header -->
    <header class="header">
      <h1>Gerenciar Indicações</h1>
    </header>

    <!-- Filtros -->
    <div class="filters">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar por nome do candidato ou vaga..." oninput="filtrarIndicacoes()">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
      </div>
      <button class="btn-filter" onclick="toggleFiltros()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
        Filtros
      </button>
    </div>

    <!-- Painel de Filtros -->
    <div class="filter-panel" id="filterPanel" style="display: none;">
      <div class="filter-group">
        <label>Status</label>
        <select id="filterStatus" onchange="filtrarIndicacoes()">
          <option value="">Todas</option>
          <option value="pendente">Pendentes</option>
          <option value="aceita">Aceitas</option>
          <option value="recusada">Recusadas</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Vaga</label>
        <select id="filterVaga" onchange="filtrarIndicacoes()">
          <option value="">Todas</option>
        </select>
      </div>
      <button class="btn-clear" onclick="limparFiltros()">Limpar filtros</button>
    </div>

    <!-- Lista de Indicações -->
    <div class="indicacoes-list" id="indicacoesList">
      <!-- Indicações serão inseridas via JS -->
    </div>
  </div>

  <script src="/js/indicacoes-recrutador.js"></script>
</body>
</html>
